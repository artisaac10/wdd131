
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn about Wisconsin, the Badger State, including its geography, population, and weather.">
    <meta name="author" content="Your Name">
    <title>Wisconsin | The Badger State</title>

    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Wisconsin</h1>
    </header>

    <main>
        <picture class="hero">
            <source
                media="(max-width: 600px)"
                srcset="images/wisconsin-small.webp">
            <img
                src="images/wisconsin-large.webp"
                alt="Nice Wisconsin farm, the dairyland"
                class="hero-image">
        </picture>

        <section class="data">
            <h2>Data</h2>

            <div class="data-list">
                <p><span>Area:</span> 65,496 sq mi</p>
                <p><span>Population:</span> 5,893,718</p>
                <p><span>Capital:</span> Madison</p>
                <p><span>Largest City:</span> Milwaukee</p>
                <p><span>Statehood:</span> May 29, 1848</p>
                <p><span>Nickname:</span> Badger State</p>
            </div>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <img
                src="images/partly-cloudy.svg"
                alt="Partly cloudy"
                class="weather-icon">

            <div class="weather-list">
                <p><span>Temperature:</span> <span id="temperature">28</span> °F</p>
                <p><span>Conditions:</span> Partly Cloudy</p>
                <p><span>Wind:</span> <span id="wind-speed">12</span> mph</p>
                <p><span>Wind Chill:</span> <span id="wind-chill">N/A</span></p>
            </div>
        </section>
    </main>

    <footer id="final-project">
        <p class="copyright">
            &copy;<span id="currentyear"></span>
            | Isaac Fischer | Wisconsin
        </p>

        <p id="lastModified"></p>
</footer>
</body>
</html>
