
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is a form to submit a product review">
    <meta name="author" content="Your Name">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <div>
                        <input type="radio" id="rating1"
                            name="rating" value="1" required>
                        <label for="rating1">☆</label>
                        <span>1</span>
                    </div>

                    <div>
                        <input type="radio" id="rating2"
                            name="rating" value="2" required>
                        <label for="rating2">☆</label>
                        <span>2</span>
                    </div>

                    <div>
                        <input type="radio" id="rating3"
                            name="rating" value="3" required>
                        <label for="rating3">☆</label>
                        <span>3</span>
                    </div>

                    <div>
                        <input type="radio" id="rating4"
                            name="rating" value="4" required>
                        <label for="rating4">☆</label>
                        <span>4</span>
                    </div>

                    <div>
                        <input type="radio" id="rating5"
                            name="rating" value="5" required>
                        <label for="rating5">☆</label>
                        <span>5</span>
                    </div>
                </div>
            </fieldset>

            <label for="installation">Date of Installation</label>
            <input type="date" id="installation"
                name="installation" required>

            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>

                <label class="checkbox-label" for="durability">
                    <input type="checkbox" id="durability"
                        name="features" value="Durability">
                    Durability
                </label>

                <label class="checkbox-label" for="ease">
                    <input type="checkbox" id="ease"
                        name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label class="checkbox-label" for="performance">
                    <input type="checkbox" id="performance"
                        name="features" value="Performance">
                    Performance
                </label>

                <label class="checkbox-label" for="design">
                    <input type="checkbox" id="design"
                        name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="written-review">
                Written Review (Optional)
            </label>
            <textarea id="written-review"
                name="written-review"
                rows="5"
                placeholder="Write your review here..."></textarea>

            <label for="username">Your Name (Optional)</label>
            <input type="text" id="username" name="username">

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer id="final-project">
        <p class="copyright">
            &copy;<span id="currentyear"></span>
            | Isaac Fischer | Wisconsin
        </p>

        <p id="lastModified"></p>
</footer>
</body>
</html>
