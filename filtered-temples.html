
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temple Album featuring photos of several kinds of temples with different shapes and sizes.">
    <meta name="author" content="Isaac Fischer">
    <title>Filtered Temple Album</title>

    <!-- Google Fonts -->
